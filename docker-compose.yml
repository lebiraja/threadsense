services:
  mongo:
    image: mongo:7.0
    env_file: .env
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./data:/data/import:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  pipeline:
    build: ./pipeline
    env_file: .env
    volumes:
      - ./data:/data:ro
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ["tools"]

  api:
    build: ./api
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  downloader:
    build: ./downloader
    user: "1000:1000"
    env_file: .env
    volumes:
      - ./data:/data
    profiles: ["tools"]

volumes:
  mongo_data:
